[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "4saves"
version = "0.5.0"
description = "A friendly terminal downloader for video and audio from sites supported by yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "mofe404" }
]
keywords = ["yt-dlp", "youtube", "tiktok", "instagram", "twitter", "x", "downloader", "macos", "premiere", "video", "audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mofe404/4saves"
Issues = "https://github.com/mofe404/4saves/issues"
Creator = "https://x.com/mofe404"

[project.scripts]
4saves = "four_saves.app:main"
4saves-desktop = "four_saves.desktop_entry:main"

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]

[tool.setuptools]
packages = ["four_saves", "ytdl_mac"]

name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python3 -m py_compile four_saves/*.py ytdl_mac/*.py
